name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-public-tree.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s support/runtime/tests -p 'test_*.py'
      - run: node --test support/diagnostics/cloud-probe/tests/*.test.mjs

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - station
          - home-control
          - home-control/tools/dreame-bridge
          - experiments/plugin-connection
          - support/diagnostics/column-agent
          - support/diagnostics/kws-probe
          - support/diagnostics/kws-offline-probe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - name: Race tests
        working-directory: ${{ matrix.module }}
        run: go test -mod=readonly -tags=nolibopusfile -race -count=1 -timeout=120s ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet -mod=readonly -tags=nolibopusfile ./...
